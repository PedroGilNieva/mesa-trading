# Mesa de trading. Dinero simulado. Cambiar límites exige PR con OK de Pedro.
#
# Carga de staging (sombra o simulado, nunca broker real ni Coinbase):
# - Gambler y House en simulado para tener PnL después de comisiones y slippage.
# - Spy sigue apagado.
# - Universo: 5 perps líquidos de Hyperliquid + el pool WETH/USDC de GeckoTerminal.
# - Filtros (ver `filters`): el spread de BTC en Hyperliquid anda en ~0.1 bp y el
#   spread sintético del pool (5 bp por lado) sale en ~10 bp. 25 bp los deja pasar
#   y sigue tirando un libro roto. La liquidez mínima de 10_000 USD está muy por
#   debajo de esos libros (cientos de millones) y solo corta polvo.
# - Volatilidad: la realizada de retornos de 5 min en BTC/ETH anda en ~0.002.
#   0.05 es ~25 veces eso; solo un libro disparado la cruza.
# - Jev: tope mensual fijado en 5 USD y tope diario 0.15 USD (30 × 0.15 = 4.50).
cadence_minutes: 5
snapshot_max_age_s: 600
capital_usd: 1000
timezone_reports: America/Mexico_City
policy_version: 1
data_retries: 2
risk:
  max_position_pct: 0.25
  max_exposure_pct: 0.25
  daily_loss_pct: 0.05
  leverage: 1
  single_position: true
judge:
  model: jev-1.14.0
  deadline_ms: 2000
  monthly_budget_usd: 5
  daily_budget_usd: 0.15
  price_usd_per_million_input_tokens: 0.042
  url: ""
filters:
  max_spread_bps: 25
  min_liquidity_usd: 10000
  max_vol: 0.05
  max_fee_fraction: 0.02
bots:
  gambler:
    enabled: true
    mode: simulated
    markets: [BTC-PERP, ETH-PERP, SOL-PERP, DOGE-PERP, XRP-PERP]
  house:
    enabled: true
    mode: simulated
    markets: [WETH-USDC]
  spy:
    enabled: false
    mode: shadow
    markets: []
connectors:
  # Apagado: Market Data Terms prohíben usar el dato en un sistema con modelo.
  # Ver docs/fuentes.md. No encender sin consentimiento escrito de Coinbase.
  coinbase:
    enabled: false
  geckoterminal:
    enabled: true
  hyperliquid:
    enabled: true
markets:
  BTC-PERP:
    venue: hyperliquid
    kind: perp
    product: BTC
    fee_schedule: hyperliquid_perp
    tick: 0.1
  ETH-PERP:
    venue: hyperliquid
    kind: perp
    product: ETH
    fee_schedule: hyperliquid_perp
    tick: 0.01
  SOL-PERP:
    venue: hyperliquid
    kind: perp
    product: SOL
    fee_schedule: hyperliquid_perp
    tick: 0.01
  DOGE-PERP:
    venue: hyperliquid
    kind: perp
    product: DOGE
    fee_schedule: hyperliquid_perp
    tick: 0.00001
  XRP-PERP:
    venue: hyperliquid
    kind: perp
    product: XRP
    fee_schedule: hyperliquid_perp
    tick: 0.0001
  WETH-USDC:
    venue: geckoterminal
    kind: spot
    product: WETH-USDC
    network: eth
    pool: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"
    # Tier real del pool (5 bps), no la tabla genérica de 30 bps. Ver config/fees.yaml.
    fee_schedule: uniswap_v3_weth_usdc_005
    tick: 0.01
house_range:
  WETH-USDC:
    low: 100
    high: 20000
# Borrador. No enciende un broker real. Ver docs/fase-dolares-reales.md.
real_money:
  enabled: false
  venue: hyperliquid
  max_capital_usd: 100
  max_order_usd: 25
  max_daily_loss_usd: 10
# Estrategias en papel (#31). Libro y reporte aparte de house/gambler; no hay
# órdenes ni broker. Capital teórico propio. Ver docs/sombra.md.
sombra:
  funding_historial_dias: 120
  # Tope de tiempo de sombra por tick (s) y páginas de funding por activo por tick.
  deadline_segundos: 20
  paginas_funding_por_tick: 2
  carry:
    enabled: true
    capital_usd: 10000
    activos: [ETH, BTC]
    # BTC no tiene pool en la mesa: se usa la tabla genérica de 30 bps (conservadora).
    fee_spot: {ETH: uniswap_v3_weth_usdc_005, BTC: dex_pool}
    fee_perp: hyperliquid_perp
    spread_spot_bps: 10
    liquidez_supuesta_usd: 50000000
    extra_bps: 1
    nocional_pct: 0.25
    ventana_funding_horas: 72
    horizonte_dias: 30
    umbral_neto_anual: 0.05
    horas_negativo_cierre: 24
    limite_base: 0.01
    descarte_dias: 30
    descarte_min_pct_positivo: 0.60
  tendencia:
    enabled: true
    capital_usd: 10000
    activos: [ETH, BTC]
    fee_schedule: hyperliquid_perp
    liquidez_supuesta_usd: 50000000
    extra_bps: 1
    riesgo_pct: 0.005
    sma_1d: 50
    donchian_entrada_4h: 20
    donchian_salida_4h: 10
    atr_1d: 14
    atr_mult_stop: 2
    # Ventaja supuesta (no medida) para el veto de economía. Decisión de producto.
    expected_edge_bps: 100
    descarte_operaciones: 20
    descarte_dias: 60
