# Umbrales de la política. La confianza del modelo no cambia el tamaño.
# Staging, a partir del reporte 2026-11-16: sin curva, el modo simulado
# hacía hold en las 1728 decisiones (sin_calibracion_aprobada) y no abría
# posiciones. Las curvas de abajo son identidad (no cambian la probabilidad).
# La identidad solo se aplica en modo simulado. No está aprobada: este periodo
# no cuenta como evidencia de edge y ningún modo con dinero real puede usarla.
# House sí puede cotizar (orden límite al 25% del capital). El SimBroker no la
# llena si no hay una vela posterior que cruce el límite; hasta ver esos fills,
# las cotizaciones no son evidencia.
# cuenta_como_evidencia queda en false: el veredicto y la calibración separan
# por version, y este periodo (version 2, curva identidad) no entra en el PnL
# ni en el skill de un GO hacia dinero real.
version: 2
cuenta_como_evidencia: false
curvas:
  gambler.regimen: {a: "1", b: "0", aprobada: false, fuente: "identidad de staging; no es evidencia de edge"}
  gambler.setup: {a: "1", b: "0", aprobada: false, fuente: "identidad de staging; no es evidencia de edge"}
  gambler.accion: {a: "1", b: "0", aprobada: false, fuente: "identidad de staging; no es evidencia de edge"}
  gambler.ejecucion_degradada: {a: "1", b: "0", aprobada: false, fuente: "identidad de staging; no es evidencia de edge"}
  gambler.presion_compra: {a: "1", b: "0", aprobada: false, fuente: "identidad de staging; no es evidencia de edge"}
  house.estado_rango: {a: "1", b: "0", aprobada: false, fuente: "identidad de staging; no es evidencia de edge"}
  house.flujo_toxico: {a: "1", b: "0", aprobada: false, fuente: "identidad de staging; no es evidencia de edge"}
  house.vale_cotizar: {a: "1", b: "0", aprobada: false, fuente: "identidad de staging; no es evidencia de edge"}
  house.hay_volumen: {a: "1", b: "0", aprobada: false, fuente: "identidad de staging; no es evidencia de edge"}
gambler:
  # No se movieron el 16 nov por la tarde: sin la bitácora no hay
  # tasa por condición para proponer otro corte. GET /decisiones/hoy
  # publica esas tasas.
  # 0.55 y 0.62 salen de las cubetas del 16 nov: la masa de `accion` está
  # en 0.4-0.6 (n=3189 de 6173) y solo ~21% llega a 0.6-0.7. setup_min 1.5
  # pide un parecido medio; 2 casi no ocurría (la cubeta 0.6+ de setup tiene n=56).
  regimen_tendencia_min_p: 0.55
  setup_min: 1.5
  accion_min_p: 0.62
  ejecucion_degradada_max_p: 0.40
  position_size_pct: 0.25
  expected_edge_bps: 40
house:
  ruptura_min_p: 0.55
  toxico_max_p: 0.45
  vale_cotizar_min: 2
  volumen_min_p: 0.50
  position_size_pct: 0.25
  expected_edge_bps: 80
spy:
  habil_min_p: 0.60
  consistente_min_p: 0.60
  copiar_min_p: 0.60
  rug_max_p: 0.30
  position_size_pct: 0.25
  expected_edge_bps: 8
